services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorpreclase-db
    environment:
      POSTGRES_DB: tutorpreclase
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
    ports:
      - "5432:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutorpreclase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos-postgres:
